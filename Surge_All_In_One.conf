[Rule]
# > 局域网直连（置顶优先匹配）
RULE-SET,LAN,DIRECT

# > 强制封锁 QUIC (UDP 443)，逼所有 App 走 TCP 从而触发去广告
AND,((PROTOCOL,UDP), (DEST-PORT,443)),REJECT-NO-DROP

DOMAIN,cloudflare-dns.com,Proxy

# > 外部规则集与资源更新（强制走代理）
DOMAIN-SUFFIX,github.com,Proxy
DOMAIN-SUFFIX,githubusercontent.com,Proxy
DOMAIN-SUFFIX,ruleset.skk.moe,Proxy
DOMAIN-SUFFIX,jsdelivr.net,Proxy
DOMAIN-SUFFIX,jsdelivr.com,Proxy

# > 自定义特定域名分流
DOMAIN-SUFFIX,binance.us,Proxy
DOMAIN-SUFFIX,bitcoin.org,Proxy
DOMAIN-SUFFIX,free-aos-cdn-image.amap.com,DIRECT
DOMAIN-SUFFIX,amemv.com,Douyin
DOMAIN-SUFFIX,zijieapi.com,Douyin
DOMAIN-SUFFIX,douyinvod.com,Douyin
DOMAIN-KEYWORD,core-lq,Douyin
DOMAIN-KEYWORD,snssdk,Douyin
DOMAIN-SUFFIX,grok.com,Proxy

# > 广告拦截
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_phishing.conf,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP

